[tool.poetry]
name = "grchombo"
version = "0.1.0"
description = "Python tools for GRChombo"
authors = ["RungeCC"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10.3,<3.15"
numpy = "^2.0.0"
matplotlib = "^3.9.0"
yt = "^4.4.0"
h5py = "^3.11.0"
imageio = "^2.36.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
